name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Attach the Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the NSIS installer and portable exe
        run: npm run tauri build
      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          Copy-Item -Path src-tauri/target/release/bundle/nsis/*.exe -Destination dist-artifacts/
          Get-ChildItem src-tauri/target/release -Filter *.exe | Copy-Item -Destination dist-artifacts/
          if (-not (Get-ChildItem dist-artifacts -Filter *.exe)) { throw "No Windows executable was produced." }
      - uses: softprops/action-gh-release@v2
        with:
          name: Glint ${{ github.ref_name }}
          body: |
            Windows build of Glint ${{ github.ref_name }}.

            The NSIS installer (`Glint_*_x64-setup.exe`) is the one to run. It can download the WebView2 runtime if Windows does not already have it. `glint.exe` is the portable build and still needs WebView2, which current Windows 10 and 11 installs include.

            Paste your own Twitch Client ID on first launch. Nothing in this release contains a client secret.
          files: dist-artifacts/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
